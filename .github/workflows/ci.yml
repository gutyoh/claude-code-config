name: CI

# The repo ships shell that installs onto other people's machines, so the gate
# has to run on more than one OS. macOS and Linux disagree on sed, stat, date
# and the system bash version — a Linux-only gate proves nothing about the
# platform half the users are on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a new push supersedes the previous run instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; each job asks for exactly what it reads.
permissions: {}

jobs:
  # What a pull request touched decides which expensive lanes it needs; pushes
  # to main and manual runs take every lane. Plain git, no third-party action.
  plan:
    name: plan
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      powershell: ${{ steps.lanes.outputs.powershell }}
      windows-bash: ${{ steps.lanes.outputs.windows-bash }}
      test-os: ${{ steps.lanes.outputs.test-os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out a merge commit; its first parent is the base.
          fetch-depth: 2
      - id: lanes
        env:
          EVENT: ${{ github.event_name }}
        run: ./.github/scripts/ci-lanes.sh "${EVENT}" >>"${GITHUB_OUTPUT}"

  static:
    name: lint + format
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Pinned by SHA, not tag: a tag is mutable, so a compromised or moved
      # tag silently changes what runs with access to the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches, so the token has no reason to stay
          # behind in .git/config where any later step could read it.
          persist-credentials: false

      # Every tool comes from mise.toml, resolved through the committed
      # mise.lock — pinned URLs and checksums rather than the GitHub API, so
      # installs are reproducible and never hit the unauthenticated rate limit.
      # --locked fails loudly if the lockfile does not cover this platform,
      # which is the whole point of committing it.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked

      - name: Report toolchain
        run: just --version && shellcheck --version | head -2 && shfmt --version

      - name: shellcheck
        run: just lint

      - name: shfmt
        run: just format-check

      - name: Audit workflows
        run: just lint-workflows

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Pinned by SHA, not tag: a tag is mutable, so a compromised or moved
      # tag silently changes what runs with access to the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit on every ref, not just the tip: a secret deleted in a
          # later commit is still published by the earlier one.
          fetch-depth: 0

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked

      - name: betterleaks (tree and full history)
        run: just secrets

  # Five legs, three of them Windows or macOS: only when PowerShell can change.
  # A failed plan runs them anyway.
  powershell:
    name: powershell (${{ matrix.os }}, ${{ matrix.shell }})
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.powershell == 'true') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: macos-latest, shell: pwsh }
          - { os: windows-latest, shell: pwsh }
          # What a stock Windows opens setup.ps1 with.
          - { os: windows-latest, shell: powershell }
          - { os: windows-11-arm, shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report PowerShell
        run: $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200

      - name: PSScriptAnalyzer and Pester
        run: ./tests/powershell-checks.ps1

  # Claude Code runs the status line through Git Bash on Windows, where each
  # process is an MSYS2 fork: its tests there, on x64 and arm64, when it moves.
  windows-bash:
    name: git bash (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.windows-bash == 'true') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    defaults:
      run:
        # Git for Windows' bash, the one Claude Code uses.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise has no Windows build of bats, so the release mise pins, by commit.
      # autocrlf off: Git for Windows would check its scripts out with CRLF.
      - name: Install bats
        env:
          BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0
        run: |
          dir="$(cygpath -u "${RUNNER_TEMP}")/bats-core"
          git -c core.autocrlf=false clone --quiet https://github.com/bats-core/bats-core "${dir}"
          git -C "${dir}" -c advice.detachedHead=false checkout --quiet "${BATS_COMMIT}"
          cygpath -w "${dir}/bin" >>"${GITHUB_PATH}"

      - name: Report toolchain
        run: |
          bash --version | head -1
          bats --version
          jq --version
          echo "OSTYPE=${OSTYPE} uname=$(uname -s)"

      - name: Status line tests
        run: bats tests/statusline-*.bats tests/cc-status.bats

  # Linux on every change; macOS (ten times the minutes) when shell code moves.
  test:
    name: tests (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 25
    strategy:
      # Never mask a macOS-only failure by cancelling the job the moment Linux
      # goes red — the cross-platform signal is the whole point of the matrix.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.test-os || '["ubuntu-24.04-arm","macos-latest"]') }}
    steps:
      # Pinned by SHA, not tag: a tag is mutable, so a compromised or moved
      # tag silently changes what runs with access to the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches, so the token has no reason to stay
          # behind in .git/config where any later step could read it.
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked

      # jq and GNU parallel are the two the lockfile cannot supply: parallel is
      # a Perl script rather than a release binary, and jq ships with the runner
      # images but not on every developer machine. parallel is optional — bats
      # falls back to serial without it.
      - name: Install GNU parallel and jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel jq

      - name: Install GNU parallel and jq (macOS)
        if: runner.os == 'macOS'
        run: brew install parallel jq

      - name: Report toolchain
        run: |
          bats --version
          just --version
          bash --version | head -1
          echo "system bash: $(/bin/bash -c 'echo $BASH_VERSION')"

      - name: Unit lane
        run: just unit

      - name: Integration lane
        run: just integration

      - name: Smoke lane
        run: just smoke

  # The one check to require on main. Required checks match job names, so a
  # matrix leg added later would otherwise be optional; `always()` keeps this
  # job from being skipped, which branch protection would count as passing.
  ci-status:
    if: always()
    needs: [plan, static, secrets, powershell, windows-bash, test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          # A lane the plan left out reports skipped; anything else must pass.
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "a job ended as ${result}"
              exit 1
            fi
          done
