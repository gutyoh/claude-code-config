name: CI

# The repo ships shell that installs onto other people's machines, so the gate
# has to run on more than one OS. macOS and Linux disagree on sed, stat, date
# and the system bash version — a Linux-only gate proves nothing about the
# platform half the users are on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a new push supersedes the previous run instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by SHA, not tag: a tag is mutable, so a compromised or moved
      # tag silently changes what runs with access to the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches, so the token has no reason to stay
          # behind in .git/config where any later step could read it.
          persist-credentials: false

      # Every tool comes from mise.toml, resolved through the committed
      # mise.lock — pinned URLs and checksums rather than the GitHub API, so
      # installs are reproducible and never hit the unauthenticated rate limit.
      # --locked fails loudly if the lockfile does not cover this platform,
      # which is the whole point of committing it.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install_args: --locked

      - name: Report toolchain
        run: just --version && shellcheck --version | head -2 && shfmt --version

      - name: shellcheck
        run: just lint

      - name: shfmt
        run: just format-check

      - name: Audit workflows
        run: just lint-workflows

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # Never mask a macOS-only failure by cancelling the job the moment Linux
      # goes red — the cross-platform signal is the whole point of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Pinned by SHA, not tag: a tag is mutable, so a compromised or moved
      # tag silently changes what runs with access to the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches, so the token has no reason to stay
          # behind in .git/config where any later step could read it.
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install_args: --locked

      # jq and GNU parallel are the two the lockfile cannot supply: parallel is
      # a Perl script rather than a release binary, and jq ships with the runner
      # images but not on every developer machine. parallel is optional — bats
      # falls back to serial without it.
      - name: Install GNU parallel and jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel jq

      - name: Install GNU parallel and jq (macOS)
        if: runner.os == 'macOS'
        run: brew install parallel jq

      - name: Report toolchain
        run: |
          bats --version
          just --version
          bash --version | head -1
          echo "system bash: $(/bin/bash -c 'echo $BASH_VERSION')"

      - name: Unit lane
        run: just unit

      - name: Integration lane
        run: just integration

      - name: Smoke lane
        run: just smoke
