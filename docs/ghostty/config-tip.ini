# Ghostty Config: TIP (1.3+ features, tip release channel)
#
# Trial config built on the power-user base with the new options
# introduced in Ghostty 1.3 (March 2026): click-to-move cursor in shell
# prompts, command-finish notifications, P3 colorspace, and OSC 52
# clipboard pass-through. Targets users on the `tip` release channel.
#
# Install: cp docs/ghostty/config-tip.ini ~/.config/ghostty/config

# -- Font ---------------------------------------------------------------
font-family = "JetBrainsMono Nerd Font"
font-size = 13
font-style = medium
font-thicken = true
bold-is-bright = true

# -- Theme --------------------------------------------------------------
theme = Catppuccin Mocha

# -- Cursor -------------------------------------------------------------
cursor-style = block
cursor-style-blink = false
# 1.3+: click anywhere in an active shell prompt to move the cursor.
# Requires OSC 133 prompt marking (fish 4+, nu 0.111+, or Ghostty's
# bundled bash/zsh shell-integration).
cursor-click-to-move = true

# -- macOS --------------------------------------------------------------
macos-titlebar-style = tabs
macos-option-as-alt = true
# `default` lets macOS own restoration. Pair with System Settings >
# Desktop & Dock > "Close windows when quitting an application" = ON
# for true close-and-forget behavior. Use `always` if you want Ghostty
# to aggressively restore tabs/splits on relaunch.
window-save-state = default
# Full P3 gamut on Apple displays — matches Terminal.app/TextEdit blending.
window-colorspace = display-p3
confirm-close-surface = false

# -- Window -------------------------------------------------------------
# `background-blur` is the canonical name as of Ghostty 1.1
# (background-blur-radius remains as a backward-compat alias).
# Integer = blur intensity (0–100ish); `true` = 20.
background-opacity = 0.9
background-blur = 16
window-padding-balance = true
resize-overlay = never

# -- Shell Integration --------------------------------------------------
# Ghostty caches $SHELL from launchd, so set `command =` explicitly.
# Ghostty does not expand ~ or env vars in path values — swap the
# absolute path below to match your install:
#   macOS Apple Silicon: /opt/homebrew/bin/fish
#   macOS Intel:         /usr/local/bin/fish
#   Linux brew:          /home/linuxbrew/.linuxbrew/bin/fish
#   Linux pkg mgr:       /usr/bin/fish
command = /opt/homebrew/bin/fish
shell-integration-features = cursor,sudo,title,ssh-env,ssh-terminfo

# -- Clipboard ----------------------------------------------------------
copy-on-select = clipboard
clipboard-trim-trailing-spaces = true
# OSC 52: lets Neovim/tmux yank text from a remote SSH host straight
# into the local macOS clipboard.
clipboard-read = allow
clipboard-write = allow

# -- Mouse --------------------------------------------------------------
mouse-hide-while-typing = true
mouse-scroll-multiplier = 2

# -- Performance --------------------------------------------------------
scrollback-limit = 10_000_000

# -- Notifications (1.3+) -----------------------------------------------
# Post a macOS notification when a long-running command finishes while
# the terminal is unfocused. Requires OSC 133 (same prereq as
# cursor-click-to-move). Default threshold is 5s — bumped to 30s here
# to avoid notification spam on routine commands.
notify-on-command-finish = unfocused
notify-on-command-finish-action = no-bell,notify
notify-on-command-finish-after = 30s

# -- Behavior -----------------------------------------------------------
quit-after-last-window-closed = true
# `download` auto-fetches new prereleases (vs `check` which only notifies).
auto-update = download
auto-update-channel = tip

# -- Quick Terminal -----------------------------------------------------
keybind = global:super+grave_accent=toggle_quick_terminal
quick-terminal-position = top
# Follow the screen with the mouse cursor — useful on multi-monitor setups.
quick-terminal-screen = mouse
quick-terminal-animation-duration = 0

# -- tmux Keybindings ---------------------------------------------------
# Assumes tmux prefix is Ctrl+a (\x01).
keybind = super+s=text:\x01\x73
keybind = super+b=text:\x01\x7a

# -- Utility Keybindings ------------------------------------------------
keybind = shift+enter=text:\n
keybind = super+shift+,=reload_config
